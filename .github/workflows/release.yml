name: release

# 태그를 밀면 앱을 빌드해 Release에 붙인다.
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Read the version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build the app, zip, and dmg
        run: scripts/make-release.sh "$VERSION"

      # cask가 dmg를 받아가므로 zip과 함께 올린다. 하나라도 빠지면 그 경로의 설치가
      # 404로 끊긴다.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/release/*.zip build/release/*.dmg --generate-notes
